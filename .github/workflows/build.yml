name: C++ CI

on:
  push:
    branches: [main, lab-2, lab-3, lab-4, lab-5, feature/github_actions]
  pull_request:
    branches: [main, lab-2, lab-3, lab-4, lab-5, feature/github_actions]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
        build_type: [Release, Debug]
    defaults:
      run:
        shell: bash
    env:
      BUILD_DIR: build-ci-${{ matrix.build_type }}
      BUILD_TYPE: ${{ matrix.build_type }}
      PATCH_VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake dpkg-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev

      - name: Configure
        run: >-
          cmake -S . -B "$BUILD_DIR"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DPATCH_VERSION="$PATCH_VERSION"
          -DBUILD_TESTING=ON
          -DBUILD_GRAPHICS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SFML=ON

      - name: Build
        run: cmake --build "$BUILD_DIR" --config "$BUILD_TYPE" --parallel 2

      - name: Test
        run: ctest --test-dir "$BUILD_DIR" -C "$BUILD_TYPE" --output-on-failure --no-tests=error

      - name: Package
        run: cpack --config "$BUILD_DIR/CPackConfig.cmake" -C "$BUILD_TYPE" -B "$BUILD_DIR/packages"

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: physics-${{ runner.os }}-${{ matrix.build_type }}
          path: |
            ${{ env.BUILD_DIR }}/packages/physics-lab5-*.zip
            ${{ env.BUILD_DIR }}/packages/physics-lab5-*.tar.gz
            ${{ env.BUILD_DIR }}/packages/physics-lab5-*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: physics-*
          path: packages
          merge-multiple: true

      - name: Create release or update assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('lab5-build-{0}', github.run_number) }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(packages/*.zip packages/*.tar.gz packages/*.deb)
          if (( ${#assets[@]} == 0 )); then
            echo "No packages were downloaded" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$COMMIT_SHA" \
              --title "Lab 5 / build $RUN_NUMBER" \
              --notes "Debug and Release packages for Linux, macOS and Windows. All CTest checks passed." \
              --latest=false
          fi
