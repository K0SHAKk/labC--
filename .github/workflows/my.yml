name: 'C++ CI'

on:
  push:
    branches:
      - lab-5
      - feature/github_actions
  release:
    types: [published]
jobs:
  build_on_Ubuntu:
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Устанавливаем зависимости, включая SFML
      - name: Install Dependencies
        run: |
            sudo apt-get update
            sudo apt-get install -y build-essential cmake libsfml-dev
            # Проверка версии SFML (опционально)
            dpkg -s libsfml-dev | grep Version

      # Строим проект
      - name: Build Project
        run: |
            rm -rf build
            mkdir build
            cd build
            cmake .. -DCMAKE_BUILD_TYPE=Release
            cmake --build . --config Release

      # Запускаем тесты
      - name: Run Tests
        run: |
            cd build
            ctest -V

      # Сборка Debug и создание пакета
      - name: Build Debug
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_BUILD_TYPE=Debug
          cmake --build . --config Debug
          cmake --build . --target package --config Debug

      # Создание релиза
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}-Linux
          release_name: Release ${{ github.run_number }} (Linux)
          draft: false
          prerelease: false

      # Загрузка DEB-пакета
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./build/physics-0.0.${{ github.run_number }}-Linux.deb
          asset_name: physics-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package

  build_macos:
    runs-on: macos-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4  # Обновлено до v4
        with:
          submodules: true

      # Установка SFML через Homebrew
      - name: Install SFML
        run: |
          brew update
          brew install sfml
          brew info sfml  # Проверка информации

      # Сборка проекта
      - name: Build Project
        run: |
          rm -rf build
          mkdir build
          cd build
          cmake .. -DCMAKE_PREFIX_PATH=$(brew --prefix sfml) -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      # Запуск тестов
      - name: Run Tests
        run: |
          cd build
          ctest -V

      # Создание пакета
      - name: Create Package
        run: |
          cd build
          cmake --build . --target package

      # Создание релиза для macOS
      - name: Create Release
        id: create_release_macos
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}-macOS
          release_name: Release ${{ github.run_number }} (macOS)
          draft: false
          prerelease: false

      # Загрузка ZIP-архива
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release_macos.outputs.upload_url }}
          asset_path: ./build/physics-0.0.${{ github.run_number }}-Darwin.zip
          asset_name: physics-0.0.${{ github.run_number }}-Darwin.zip
          asset_content_type: application/zip