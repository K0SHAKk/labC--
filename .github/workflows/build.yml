name: C++ CI

on:
  push:
    branches: [main, lab-2, lab-3, lab-4, lab-5, feature/github_actions]
  pull_request:
    branches: [main, lab-2, lab-3, lab-4, lab-5, feature/github_actions]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PATCH_VERSION: ${{ github.run_number }}
      ASSET_NAME: lab4-0.0.${{ github.run_number }}-Linux.deb
      DEBUG_ASSET_NAME: lab4-0.0.${{ github.run_number }}-Linux-Debug.deb
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake dpkg-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev libfreetype-dev

      - name: Configure Release
        run: >-
          cmake -S . -B build-ci-Release
          -DCMAKE_BUILD_TYPE=Release
          -DPATCH_VERSION="$PATCH_VERSION"
          -DBUILD_TESTING=ON
          -DBUILD_GRAPHICS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SFML=ON

      - name: Build Release
        run: cmake --build build-ci-Release --config Release --parallel 2

      - name: Run Tests
        run: ctest --test-dir build-ci-Release -C Release --output-on-failure --no-tests=error

      - name: Package Release DEB
        run: |
          cpack --config build-ci-Release/CPackConfig.cmake -C Release -G DEB -B packages-release
          mv packages-release/physics-lab5-*-Linux-*-Release.deb "packages-release/$ASSET_NAME"

      - name: Configure Debug
        run: >-
          cmake -S . -B build-ci-Debug
          -DCMAKE_BUILD_TYPE=Debug
          -DPATCH_VERSION="$PATCH_VERSION"
          -DBUILD_TESTING=ON
          -DBUILD_GRAPHICS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SFML=ON

      - name: Build Debug
        run: cmake --build build-ci-Debug --config Debug --parallel 2

      - name: Package Debug DEB
        run: |
          cpack --config build-ci-Debug/CPackConfig.cmake -C Debug -G DEB -B packages
          mv packages/physics-lab5-*-Linux-*-Debug.deb "packages/$DEBUG_ASSET_NAME"

      - name: Upload Debug Asset
        uses: actions/upload-artifact@v7
        with:
          name: debug-deb
          path: packages/${{ env.DEBUG_ASSET_NAME }}
          if-no-files-found: error

      - name: Create Release (Linux)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.run_number }}-Linux2
          RELEASE_NAME: Release ${{ github.run_number }} for linux2
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "packages-release/$ASSET_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "packages-release/$ASSET_NAME" \
              --target "$COMMIT_SHA" --title "$RELEASE_NAME" --notes ""
          fi

  build_macos:
    runs-on: macos-15-intel
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PATCH_VERSION: ${{ github.run_number }}
      ASSET_NAME: lab4-0.0.${{ github.run_number }}-Darwin.zip
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >-
          cmake -S . -B build-ci-Release
          -DCMAKE_BUILD_TYPE=Release
          -DPATCH_VERSION="$PATCH_VERSION"
          -DBUILD_TESTING=ON
          -DBUILD_GRAPHICS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_SFML=ON

      - name: Build
        run: cmake --build build-ci-Release --config Release --parallel 2

      - name: Run Tests
        run: ctest --test-dir build-ci-Release -C Release --output-on-failure --no-tests=error

      - name: Package ZIP
        run: |
          cpack --config build-ci-Release/CPackConfig.cmake -C Release -G ZIP -B packages
          mv packages/physics-lab5-*-Darwin-*-Release.zip "packages/$ASSET_NAME"

      - name: Upload MacOS Asset
        uses: actions/upload-artifact@v7
        with:
          name: macos-zip
          path: packages/${{ env.ASSET_NAME }}
          if-no-files-found: error

      - name: Create Release (MacOS)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.run_number }}
          RELEASE_NAME: Release ${{ github.run_number }} (MacOS)
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "packages/$ASSET_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" "packages/$ASSET_NAME" \
              --target "$COMMIT_SHA" --title "$RELEASE_NAME" --notes ""
          fi
